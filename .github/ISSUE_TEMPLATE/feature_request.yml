name: Feature Request
description: Suggest a new feature or improvement for the app
title: "[Feature] "
labels: [enhancement]
assignees: [andiwirz]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement! Please describe your idea as clearly as possible.

  - type: markdown
    attributes:
      value: "## Your Request"

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short, clear description of the feature you'd like to see.
      placeholder: e.g. Show battery level on sensor tiles
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this solve, or what use case does it enable?
      placeholder: e.g. I have several door sensors and I can't tell when the batteries are running low without opening the Homey app.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you imagine this working? Describe the behaviour, UI, or interaction you have in mind.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you found any workarounds or alternative approaches?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app does this relate to?
      options:
        - Dashboard tiles / device control
        - Energy Dashboard
        - Flow buttons
        - Profiles / display configuration
        - Settings page
        - Performance / reliability
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, links, or anything else that helps illustrate the idea.
    validations:
      required: false
