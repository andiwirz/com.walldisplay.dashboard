<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#E8001D">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Shelly Wall Display Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="#F5A623"/>
        <path d="M16 7 L25 14 L25 25 L19 25 L19 19 L13 19 L13 25 L7 25 L7 14 Z" fill="white"/>
      </svg>
      <span class="header-title" id="header-title"></span>
    </div>
    <div id="search-bar" class="search-bar" style="display:none">
      <svg class="search-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" class="search-input" type="text" placeholder="Search…" data-i18n-attr="placeholder" data-i18n-attr-key="search" autocomplete="off">
      <button class="search-close-btn" onclick="closeSearch()">✕</button>
    </div>
    <div class="header-right">
      <button id="room-filter-btn" class="filter-hdr-btn" onclick="toggleRoomChips()" aria-label="Rooms" title="Rooms" data-i18n-attr="title,aria-label" data-i18n-attr-key="rooms" style="display:none">
        <span class="hdr-emoji">☰</span>
        <svg class="hdr-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <button id="search-btn" class="search-hdr-btn" onclick="openSearch()" aria-label="Search" title="Search" data-i18n-attr="title,aria-label" data-i18n-attr-key="searchLabel" style="display:none">
        <span class="hdr-emoji">🔍</span>
        <svg class="hdr-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button id="camera-filter-btn" class="filter-hdr-btn" onclick="toggleClassFilter('camera')" aria-label="Cameras" title="Cameras" data-i18n-attr="title,aria-label" data-i18n-attr-key="cameras" style="display:none">
        <span class="hdr-emoji">📷</span>
        <svg class="hdr-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <button id="speaker-filter-btn" class="filter-hdr-btn" onclick="toggleClassFilter('speaker')" aria-label="Media Players" title="Media Players" data-i18n-attr="title,aria-label" data-i18n-attr-key="mediaPlayers" style="display:none">
        <span class="hdr-emoji">🎵</span>
        <svg class="hdr-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>
      <button id="thermostat-filter-btn" class="filter-hdr-btn" onclick="toggleClassFilter('thermostat')" aria-label="Thermostats" title="Thermostats" data-i18n-attr="title,aria-label" data-i18n-attr-key="thermostats" style="display:none">
        <span class="hdr-emoji">🌡️</span>
        <svg class="hdr-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
      </button>
      <button id="light-filter-btn" class="filter-hdr-btn" onclick="toggleClassFilter('light')" aria-label="Lights" title="Lights" data-i18n-attr="title,aria-label" data-i18n-attr-key="lights" style="display:none">
        <span class="hdr-emoji">💡</span>
        <svg class="hdr-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
      </button>
      <button id="blinds-filter-btn" class="filter-hdr-btn" onclick="toggleClassFilter('blinds')" aria-label="Blinds" title="Blinds" data-i18n-attr="title,aria-label" data-i18n-attr-key="blinds" style="display:none">
        <span class="hdr-emoji">🪟</span>
        <svg class="hdr-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="11" x2="21" y2="11"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="15" x2="12" y2="21"/></svg>
      </button>
      <button id="view-toggle" class="view-toggle-btn" onclick="toggleView()">
        <span class="hdr-emoji">⊞ All</span>
        <svg class="hdr-svg hdr-svg-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <svg class="hdr-svg hdr-svg-rooms" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="8" rx="1"/><rect x="14" y="15" width="7" height="6" rx="1"/></svg>
      </button>
      <button id="weather-btn" class="weather-hdr-btn" onclick="openWeatherModal()" aria-label="Weather" title="Weather" data-i18n-attr="title,aria-label" data-i18n-attr-key="weather" style="display:none">
        <span class="hdr-emoji">🌤️</span>
        <svg class="hdr-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6,19A5,5 0 0,1 1,14A5,5 0 0,1 6,9C7,6.65 9.3,5 12,5C15.43,5 18.24,7.66 18.5,11.03L19,11A4,4 0 0,1 23,15A4,4 0 0,1 19,19H6M19,13H17V12A5,5 0 0,0 12,7C9.5,7 7.45,8.82 7.06,11.19C6.73,11.07 6.37,11 6,11A3,3 0 0,0 3,14A3,3 0 0,0 6,17H19A2,2 0 0,0 21,15A2,2 0 0,0 19,13Z"/></svg>
      </button>
      <button id="energy-btn" class="energy-btn" onclick="openEnergyModal()" aria-label="Energy dashboard" title="Energy" data-i18n-attr="title,aria-label" data-i18n-attr-key="energy">
        <span class="hdr-emoji">⚡</span>
        <svg class="hdr-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 20V12H2L12 3L22 12H19V20H5M12 5.69L7 10.19V18H17V10.19L12 5.69M11.5 18V14H9L12.5 7V11H15L11.5 18Z"/></svg>
      </button>
      <button id="ev-btn" class="ev-btn" onclick="openEvModal()" aria-label="EV dashboard" title="EV" data-i18n-attr="title,aria-label" data-i18n-attr-key="evTitle" style="display:none">
        <span class="hdr-emoji">🚗</span>
        <svg class="hdr-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6,11L7,7H17L18,11M18.92,6C18.71,5.4 18.14,5 17.5,5H6.5C5.86,5 5.29,5.4 5.08,6L3,12V20A1,1 0 0,0 4,21H5A1,1 0 0,0 6,20V18H18V20A1,1 0 0,0 19,21H20A1,1 0 0,0 21,20V12L18.92,6M7,16H5V14H7V16M19,16H17V14H19V16M14,16H10V14H14V16Z"/></svg>
      </button>
      <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle dark mode" data-i18n-attr="aria-label" data-i18n-attr-key="themeToggle">
        <span class="hdr-emoji">🔆</span>
        <svg class="hdr-svg hdr-svg-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="7.05" y2="7.05"/><line x1="16.95" y1="16.95" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="7.05" y2="16.95"/><line x1="16.95" y1="7.05" x2="19.78" y2="4.22"/></svg>
        <svg class="hdr-svg hdr-svg-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <span id="clock" class="clock"></span>
    </div>
  </header>

  <div id="room-chips" class="room-chips" style="display:none"></div>

  <main id="main" class="main">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading devices…</p>
    </div>
    <div id="error-msg" class="error-msg" style="display:none">
      <p>&#9888; Connection failed</p>
      <button onclick="loadData()" data-i18n="tryAgain">Try again</button>
    </div>
    <div id="zones-container" style="display:none"></div>
  </main>

  <!-- PIN-Modal -->
  <div id="pin-modal" class="pin-modal" style="display:none">
    <div class="pin-modal-inner">
      <div class="pin-modal-title" id="pin-modal-title" data-i18n="enterPin">Enter PIN</div>
      <div class="pin-dots" id="pin-dots">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="pin-error" id="pin-error"></div>
      <div class="pin-pad">
        <button onclick="pinKey('1')">1</button>
        <button onclick="pinKey('2')">2</button>
        <button onclick="pinKey('3')">3</button>
        <button onclick="pinKey('4')">4</button>
        <button onclick="pinKey('5')">5</button>
        <button onclick="pinKey('6')">6</button>
        <button onclick="pinKey('7')">7</button>
        <button onclick="pinKey('8')">8</button>
        <button onclick="pinKey('9')">9</button>
        <button onclick="pinCancel()" class="pin-cancel">✕</button>
        <button onclick="pinKey('0')">0</button>
        <button onclick="pinBackspace()" class="pin-back">⌫</button>
      </div>
    </div>
  </div>

  <!-- Energy Modal -->
  <div id="energy-modal" class="energy-modal" style="display:none" onclick="closeEnergyModal()">
    <div class="energy-modal-inner" onclick="event.stopPropagation()">
      <div class="energy-modal-hdr">
        <span class="energy-modal-title">
          <span class="hdr-emoji">⚡</span>
          <svg class="hdr-svg modal-title-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 20V12H2L12 3L22 12H19V20H5M12 5.69L7 10.19V18H17V10.19L12 5.69M11.5 18V14H9L12.5 7V11H15L11.5 18Z"/></svg>
          <span data-i18n="energy">Energy</span>
        </span>
        <div class="energy-tabs">
          <button id="energy-tab-live"    class="energy-tab active" onclick="switchEnergyTab('live')" data-i18n="live">Live</button>
          <button id="energy-tab-devices" class="energy-tab"        onclick="switchEnergyTab('devices')" data-i18n="devicesTab">Devices</button>
          <button id="energy-tab-history" class="energy-tab"        onclick="switchEnergyTab('history')" data-i18n="sevenDays">7 Days</button>
        </div>
        <button class="energy-close-btn" onclick="closeEnergyModal()">✕</button>
      </div>
      <div id="energy-body" class="energy-body">
        <div class="energy-spinner"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- Weather Modal -->
  <div id="weather-modal" class="weather-modal" style="display:none" onclick="closeWeatherModal()">
    <div class="weather-modal-inner" onclick="event.stopPropagation()">
      <div class="weather-modal-hdr">
        <span class="weather-modal-title">
          <span class="hdr-emoji">🌤️</span>
          <svg class="hdr-svg modal-title-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6,19A5,5 0 0,1 1,14A5,5 0 0,1 6,9C7,6.65 9.3,5 12,5C15.43,5 18.24,7.66 18.5,11.03L19,11A4,4 0 0,1 23,15A4,4 0 0,1 19,19H6M19,13H17V12A5,5 0 0,0 12,7C9.5,7 7.45,8.82 7.06,11.19C6.73,11.07 6.37,11 6,11A3,3 0 0,0 3,14A3,3 0 0,0 6,17H19A2,2 0 0,0 21,15A2,2 0 0,0 19,13Z"/></svg>
          <span data-i18n="weather">Weather</span>
        </span>
        <div class="weather-tabs">
          <button id="weather-tab-today" class="weather-tab active" onclick="switchWeatherTab('today')" data-i18n="today">Today</button>
          <button id="weather-tab-week"  class="weather-tab"        onclick="switchWeatherTab('week')" data-i18n="sevenDays">7 Days</button>
        </div>
        <button class="weather-close-btn" onclick="closeWeatherModal()">✕</button>
      </div>
      <div id="weather-body" class="weather-body">
        <div class="wm-spinner"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- EV Modal -->
  <div id="ev-modal" class="ev-modal" style="display:none" onclick="closeEvModal()">
    <div class="ev-modal-inner" onclick="event.stopPropagation()">
      <div class="ev-modal-hdr">
        <span class="ev-modal-title">
          <span class="hdr-emoji">🚗</span>
          <svg class="hdr-svg modal-title-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6,11L7,7H17L18,11M18.92,6C18.71,5.4 18.14,5 17.5,5H6.5C5.86,5 5.29,5.4 5.08,6L3,12V20A1,1 0 0,0 4,21H5A1,1 0 0,0 6,20V18H18V20A1,1 0 0,0 19,21H20A1,1 0 0,0 21,20V12L18.92,6M7,16H5V14H7V16M19,16H17V14H19V16M14,16H10V14H14V16Z"/></svg>
          <span data-i18n="evTitle">EV</span>
        </span>
        <button class="ev-close-btn" onclick="closeEvModal()">✕</button>
      </div>
      <div id="ev-body" class="ev-body">
        <div class="ev-spinner"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- Flow Bestätigungs-Modal -->
  <div id="flow-confirm-modal" class="confirm-modal" style="display:none">
    <div class="confirm-modal-inner">
      <div class="confirm-title" id="flow-confirm-title" data-i18n="startFlow">Start Flow?</div>
      <div class="confirm-name" id="flow-confirm-name"></div>
      <div class="confirm-btns">
        <button id="flow-confirm-cancel" class="confirm-btn confirm-btn-cancel">✕</button>
        <button id="flow-confirm-ok" class="confirm-btn confirm-btn-ok" data-i18n="startBtn">▶ Start</button>
      </div>
    </div>
  </div>

  <!-- Kamera-Modal -->
  <div id="camera-modal" class="camera-modal" style="display:none" onclick="closeCameraModal()">
    <div class="camera-modal-inner" id="camera-modal-inner" onclick="event.stopPropagation()">
      <div class="camera-modal-header">
        <span id="camera-modal-title" class="camera-modal-name"></span>
        <button class="camera-modal-close" onclick="closeCameraModal()">✕</button>
      </div>
      <div class="camera-modal-body">
        <img id="camera-modal-img" class="camera-modal-img" alt="Camera image" src="">
        <div id="camera-modal-spinner" class="camera-modal-spinner" style="display:none"></div>
        <div id="camera-modal-error" class="camera-modal-error" style="display:none" data-i18n="noImage">No image available</div>
      </div>
    </div>
  </div>

  <!-- Price Modal -->
  <div id="price-modal" class="price-modal" style="display:none" onclick="if(event.target===this)closePriceModal()">
    <div class="price-modal-inner">
      <div class="price-modal-header">
        <span id="price-modal-name" class="price-modal-name"></span>
        <button class="price-modal-close" onclick="closePriceModal()">✕</button>
      </div>
      <div id="price-modal-current" class="price-modal-current"></div>
      <div id="price-modal-chart" class="price-modal-chart-wrap"></div>
    </div>
  </div>

  <!-- Alarm-Modal -->
  <div id="alarm-modal" class="lock-modal" style="display:none" onclick="if(event.target===this)closeAlarmModal()">
    <div class="lock-modal-inner">
      <div class="lock-modal-header">
        <span id="alarm-modal-name" class="lock-modal-name"></span>
        <button class="lock-modal-close" onclick="closeAlarmModal()">✕</button>
      </div>
      <div id="alarm-modal-status" class="lock-modal-status"></div>
      <div id="alarm-modal-actions" class="lock-modal-actions"></div>
    </div>
  </div>

  <!-- Lock-Modal -->
  <div id="lock-modal" class="lock-modal" style="display:none" onclick="if(event.target===this)closeLockModal()">
    <div class="lock-modal-inner">
      <div class="lock-modal-header">
        <span id="lock-modal-name" class="lock-modal-name"></span>
        <button class="lock-modal-close" onclick="closeLockModal()">✕</button>
      </div>
      <div id="lock-modal-status" class="lock-modal-status"></div>
      <div id="lock-modal-actions" class="lock-modal-actions"></div>
    </div>
  </div>

  <!-- Thermostat-Modal -->
  <div id="thermostat-modal" class="thermostat-modal" style="display:none" onclick="if(event.target===this)closeThermostatModal()">
    <div class="thermostat-modal-inner">
      <div class="thermostat-modal-header">
        <span id="thermostat-modal-name" class="thermostat-modal-name"></span>
        <button class="thermostat-modal-close" onclick="closeThermostatModal()">✕</button>
      </div>
      <div class="thermostat-body">
        <div class="thermostat-temps">
          <div class="thermostat-temp-block">
            <div class="thermostat-temp-label" data-i18n="current">Current</div>
            <div class="thermostat-temp-current" id="thermostat-current-temp">—</div>
          </div>
          <div class="thermostat-arrow">→</div>
          <div class="thermostat-temp-block">
            <div class="thermostat-temp-label">Target</div>
            <div class="thermostat-temp-target" id="thermostat-target-temp">—</div>
          </div>
        </div>
        <div class="thermostat-adjust">
          <button id="thermostat-onoff-btn" class="thermostat-onoff-btn" onclick="thermostatToggleOnOff()" style="display:none">Off</button>
          <button class="thermostat-adj-btn" onclick="thermostatAdjust(0.5)">＋</button>
          <button class="thermostat-adj-btn thermostat-adj-minus" onclick="thermostatAdjust(-0.5)">－</button>
        </div>
        <div class="thermostat-modes" id="thermostat-modes"></div>
      </div>
    </div>
  </div>

  <!-- Speaker-Modal -->
  <div id="speaker-modal" class="speaker-modal" style="display:none" onclick="if(event.target===this)closeSpeakerModal()">
    <div class="speaker-modal-inner">
      <div class="speaker-modal-header">
        <span id="speaker-modal-name" class="speaker-modal-name"></span>
        <button class="speaker-modal-close" onclick="closeSpeakerModal()">✕</button>
      </div>
      <div class="speaker-modal-body">
        <div class="speaker-main-col">
          <div id="speaker-cover-wrap" class="speaker-cover-wrap">
            <img id="speaker-cover" class="speaker-cover" alt="" src="">
          </div>
          <div class="speaker-track-info">
            <div class="speaker-track-name" id="speaker-track-name">—</div>
            <div class="speaker-track-artist" id="speaker-track-artist"></div>
            <div class="speaker-track-album" id="speaker-track-album"></div>
          </div>
        </div>
        <!-- Vertikaler Slider (native, grosse Screens) -->
        <div class="speaker-vol-col">
          <input type="range" class="speaker-vol-slider" id="speaker-vol-slider" min="0" max="100" value="50">
          <button class="speaker-mute-btn" id="speaker-mute-btn" onclick="speakerToggleMute()"></button>
        </div>
        <!-- Rotierter horizontaler Slider (kleine Screens) -->
        <div class="speaker-vol-col-sm">
          <div class="speaker-vol-rotate-wrap">
            <input type="range" class="speaker-vol-slider-h" id="speaker-vol-slider-row" min="0" max="100" value="50">
          </div>
          <button class="speaker-mute-btn" id="speaker-mute-btn-row" onclick="speakerToggleMute()"></button>
        </div>
      </div>
      <div class="speaker-controls">
        <button class="speaker-btn" id="speaker-shuffle-btn" onclick="speakerToggleShuffle()" title="Shuffle"></button>
        <button class="speaker-btn speaker-btn-prev" id="speaker-prev-btn" onclick="speakerPrev()" title="Previous"></button>
        <button class="speaker-btn speaker-btn-play" id="speaker-play-btn" onclick="speakerPlayPause()"></button>
        <button class="speaker-btn speaker-btn-next" id="speaker-next-btn" onclick="speakerNext()" title="Next"></button>
        <button class="speaker-btn" id="speaker-repeat-btn" onclick="speakerCycleRepeat()" title="Repeat"></button>
      </div>
    </div>
  </div>

  <!-- Cover Fullscreen Overlay -->
  <div id="cover-fullscreen" class="cover-fullscreen" style="display:none" onclick="dismissCoverFullscreen()">
    <div id="cover-fullscreen-bg" class="cover-fullscreen-bg"></div>
    <div class="cover-fullscreen-info">
      <div id="cover-fs-track"  class="cover-fs-track"></div>
      <div id="cover-fs-artist" class="cover-fs-artist"></div>
    </div>
    <div class="cover-fullscreen-hint" data-i18n="tapToReturn">tap to return</div>
  </div>

  <!-- Nachricht-Modal -->
  <div id="message-modal" class="message-modal" style="display:none">
    <div class="message-modal-inner">
      <button class="message-modal-close" onclick="closeMessageModal()">✕</button>
      <div class="message-modal-text" id="message-modal-text"></div>
      <div class="message-modal-countdown" id="message-modal-countdown" style="display:none"></div>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
